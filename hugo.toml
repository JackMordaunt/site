baseurl = "https://mordaunt.dev/site/"
title = "Jack Mordaunt"
theme = "hugo-coder"
# Content is written with root-relative image paths, and this site is
# served from a subdirectory on mordaunt.dev and from the root on
# jackmordaunt.com. canonifyURLs resolves those paths against whichever
# baseURL the build was given, so one source tree is correct in both
# places; without it the project pages 404 their screenshots on one of
# them, whichever way the paths are written.
canonifyURLs = true
languagecode = "en"
defaultcontentlanguage = "en"

[pagination]
pagerSize = 20

[services]
# [services.disqus]
# shortname = "yourdiscussshortname"

[markup.highlight]
style = "github-dark"

# Content pages written as .html (about, contact, pay-with-bitcoin). Hugo's
# default policy allows everything but text/html; this allowlist admits it.
[security]
  allowContent = ["^text/(html|markdown)$"]

[params]
  author = "Jack Mordaunt"
  info = "Coffee developer, software brewer."
  description = "Coffee developer, software brewer."
  keywords = "blog,developer,personal,software,robust,performance,sovereign"
  # 640px for a 20rem (320px) slot, so it is sharp at 2x and no larger.
  # The 1196px JPEG it replaced was 530 KB, over half the weight of the
  # front page. bin/resize-images regenerates it.
  avatarurl = "images/self.webp"
  # gravatar = "gravatar@sovereignlife.anonaddy.com"

  # Relative, so relURL resolves them against baseURL: this site is served
  # under /site/ on mordaunt.dev and at the root on jackmordaunt.com. An
  # absolute path would be right in exactly one of those places.
  favicon_32 = "images/favicon-32.png"
  favicon_16 = "images/favicon-16.png"
  touchicon  = "images/apple-touch-icon.png"

  since = 2025

  enableTwemoji = true

  colorScheme = "auto"
  hidecolorschemetoggle = false

  customCSS = ["css/custom.css"]
  # customSCSS = ["scss/custom.scss"]
  # customJS = ["js/custom.js"]

[markup.goldmark.renderer]
  unsafe = true

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"
  author = "authors"


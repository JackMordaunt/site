baseurl = "https://mordaunt.dev/site/"
title = "Jack Mordaunt"
# Content is written with root-relative image paths, and this site is
# served from a subdirectory on mordaunt.dev and from the root on
# jackmordaunt.com. canonifyURLs resolves those paths against whichever
# baseURL the build was given, so one source tree is correct in both
# places.
canonifyURLs = true
languagecode = "en"
defaultcontentlanguage = "en"
disableKinds = ["taxonomy", "term"]

[pagination]
pagerSize = 20

[markup.goldmark.renderer]
  # Posts embed SVG and the odd element Markdown has no spelling for.
  unsafe = true

[markup.highlight]
  # Classes, not inline colours: the stylesheet colours code from the
  # same tokens as everything else, in both modes.
  noClasses = false

[params]
  author = "Jack Mordaunt"
  description = "Lean, efficient, powerful, sovereign software: the standard Jack Mordaunt builds native desktop software and small, sharp tools to, in Go and Odin."
  # The domain's one stylesheet, served by mordaunt.dev. The server's
  # build passes the content-hashed name in HUGO_PARAMS_DESIGNCSS; this
  # is the name a local build links, and what the alias build fetches.
  designcss = "/assets/design.css"
  domain = "mordaunt.dev"
  # The family motto, Aeneid IX.187, set in the footer of every page.
  motto = "Nec placida contenta quiete est"
  motto_en = "Not content with quiet rest"
  # The NIP-05 name is "_", the root identifier, which clients show as the bare domain.
  nip05 = "mordaunt.dev"
  npub = "npub14l0387z0ejfmnn3j38nnalg5p57952d84aqakqguhzx7p7pns2vqg3x78w"
  lightning = "jack@mordaunt.dev"
  github = "https://github.com/JackMordaunt"
  sourcehut = "https://git.sr.ht/~jackmordaunt"
  favicon_32 = "images/favicon-32.png"
  favicon_16 = "images/favicon-16.png"
  touchicon  = "images/apple-touch-icon.png"

[[menu.main]]
  name = "Work"
  weight = 1
  url = "work/"
[[menu.main]]
  name = "Writing"
  weight = 2
  url = "posts/"
[[menu.main]]
  name = "About"
  weight = 3
  url = "about/"
[[menu.main]]
  name = "Contact"
  weight = 4
  url = "contact/"
